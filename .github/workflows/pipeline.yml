name: History Shorts Auto Pipeline

# Runs once a day (UTC). US Eastern times shift by one hour in winter.
on:
  schedule:
    - cron: "0 17 * * *"   # ~12:00 PM US Eastern (winter)
  workflow_dispatch: {}

# Never let two runs overlap.
concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  make-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run full pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: python3 run_pipeline.py

      - name: Write run report
        if: always()
        run: python3 run_summary.py >> "$GITHUB_STEP_SUMMARY" || true

      - name: Save topic state back to the repo
        if: always()
        run: |
          git config user.name "history-shorts-bot"
          git config user.email "bot@users.noreply.github.com"

          for f in used_topics.json generated_topics.json uploaded_history.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update topic state [skip ci]"

          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            if git push; then
              echo "State saved on attempt $attempt."
              exit 0
            fi
            sleep 5
          done

          echo "::error::Could not save topic state. Duplicate topics are likely next run."
          exit 1
